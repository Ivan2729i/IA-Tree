{% if messages %}
    <div id="django-messages" class="hidden">
        {% for message in messages %}
            <span data-toast-message="{{ message|escape }}" data-toast-type="{{ message.tags|default:'info' }}"></span>
        {% endfor %}
    </div>
{% endif %}

<div id="toast-container"
     class="pointer-events-none fixed right-4 top-4 z-[200] flex w-[calc(100%-2rem)] max-w-sm flex-col gap-3 sm:right-5 sm:top-5">
</div>
