<!DOCTYPE html>
<html lang="es">

<body style="margin:0; padding:0; background:#f5f5f7; font-family:Arial,Helvetica,sans-serif; color:#111827;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
    <tr>
        <td align="center">

            <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background:#ffffff; border-radius:16px; overflow:hidden;">

                <tr>
