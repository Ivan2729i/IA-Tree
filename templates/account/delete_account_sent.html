{% extends "base.html" %}

{% block title %}Revisa tu correo | {{ APP_NAME }}{% endblock %}

{% block content %}

<div class="mx-auto max-w-xl">

    <section class="rounded-2xl bg-white p-6 text-center shadow-sm ring-1 ring-border sm:p-8">

        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl border border-accent/15 bg-accent/10 text-primary">

            <svg class="h-7 w-7"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="m3 7 9 6 9-6"/>
            </svg>

        </div>


        <h1 class="mt-5 text-2xl font-bold tracking-tight text-primary">
            Revisa tu correo
        </h1>


        <p class="mt-3 text-sm leading-6 text-slate-500">
            Enviamos un enlace de confirmación a
            <span class="font-semibold text-primary">
                {{ request.user.email }}
            </span>.
        </p>


        <p class="mt-2 text-sm leading-6 text-slate-500">
            Tu cuenta todavía no ha sido eliminada.
        </p>


        <a href="{% url 'accounts:settings' %}"
           class="btn-base btn-outline btn-shine mt-6">
            <span>Volver a configuración</span>
        </a>

    </section>

</div>

{% endblock %}
