{% extends "auth/base_auth.html" %}

{% block title %}Contraseña actualizada | {{ APP_NAME }}{% endblock %}

{% block auth_content %}

<div class="text-center">

    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl border border-success/15 bg-success/10 text-success">
        <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 6 9 17l-5-5"/>
        </svg>
    </div>

    <h1 class="mt-6 text-2xl font-bold tracking-tight text-primary sm:text-3xl">
        Contraseña actualizada
    </h1>

    <p class="mx-auto mt-3 max-w-sm text-sm leading-6 text-slate-500">
        Tu contraseña fue restablecida correctamente. Ya puedes iniciar sesión con la nueva contraseña.
    </p>

    <a href="{% url 'account_login' %}"
       class="btn-base btn-primary btn-shine mt-7 w-full">
        <span>Iniciar sesión</span>
    </a>

</div>

{% endblock %}
