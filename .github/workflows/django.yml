name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Crear archivo .env desde los Secrets de GitHub
      run: |
        echo "DEFAULT_FROM_EMAIL=\"${{ secrets.DEFAULT_FROM_EMAIL }}\"" >> .env
        echo "DJANGO_ALLOWED_HOSTS=\"${{ secrets.DJANGO_ALLOWED_HOSTS }}\"" >> .env
        echo "DJANGO_DEBUG=\"${{ secrets.DJANGO_DEBUG }}\"" >> .env
        echo "DJANGO_SECRET_KEY=\"${{ secrets.DJANGO_SECRET_KEY }}\"" >> .env
        echo "GOOGLE_OAUTH_CLIENT_ID=\"${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}\"" >> .env
        echo "GOOGLE_OAUTH_CLIENT_SECRET=\"${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}\"" >> .env
        echo "MAIL_HOST=\"${{ secrets.MAIL_HOST }}\"" >> .env
        echo "MAIL_PASSWORD=\"${{ secrets.MAIL_PASSWORD }}\"" >> .env
        echo "MAIL_PORT=\"${{ secrets.MAIL_PORT }}\"" >> .env
        echo "MAIL_USERNAME=\"${{ secrets.MAIL_USERNAME }}\"" >> .env
        echo "MAIL_USE_TLS=\"${{ secrets.MAIL_USE_TLS }}\"" >> .env
    - name: Run Tests
      run: |
        python manage.py test
